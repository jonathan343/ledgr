[project]
name = "ledgr"
version = "0.0.1"
description = "Fragment-based changelogs and semantic versioning."
readme = "README.md"
authors = [
    { name = "jonathan343", email = "jonathangee09@gmail.com" }
]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3", "Jinja2>=3.1.6", "tomlkit>=0.14"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.scripts]
ledgr = "ledgr.cli:main"

[dependency-groups]
lint = ["ruff>=0.16.8", "prek>=0.5.3"]
test = ["pytest>=9"]
typecheck = ["ty>=0.0.84"]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
python-version = "3.11"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
