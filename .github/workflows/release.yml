name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          python-version: "3.11"
          enable-cache: false
      - name: Validate release tag
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Expected a stable X.Y.Z version")
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Tag must match project.version")
          if not pathlib.Path(f".ledgr/releases/{version}.json").is_file():
              raise SystemExit("Run ledgr release and commit its archive before tagging")
          if any(pathlib.Path(".ledgr/changes").glob("*.md")):
              raise SystemExit("Release still has pending changelog entries")
          PY
      - name: Validate and test
        run: |
          uv run --locked --no-default-groups --group test ledgr check
          uv run --locked --no-default-groups --group test pytest
      - name: Build distributions
        run: uv build
      - name: Smoke test installed wheel
        run: uv run --isolated --no-project --with dist/*.whl ledgr --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ledgr/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish
        run: uv publish --trusted-publishing always
