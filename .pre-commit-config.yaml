fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--offline, --strict-collection, --no-progress]

  # Use the same locked Ruff version as direct `uv run ruff` commands.
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --no-default-groups --group lint ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --no-default-groups --group lint ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: uv-lock-check
        name: Check uv.lock is current
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
